version: "0.1.0"
description: Board Support Package (BSP) for ESP32-LyraT-Mini v1.2
url: https://github.com/espressif/esp-bsp/tree/master/bsp/esp32_lyrat_mini

targets:
  - esp32

tags:
  - bsp
  - audio

dependencies:
  idf: ">=5.3"

  button:
    version: "^4"
    public: true

  led_indicator:
    version: "^2"
    public: true

  esp_codec_dev:
    version: "*"
    public: true
    override_path: "../../components/esp_codec_dev"

examples:
  - path: ../../examples/audio